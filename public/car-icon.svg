<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Car body -->
  <rect x="8" y="28" width="48" height="20" rx="4" fill="#10b981"/>
  <!-- Car roof -->
  <rect x="16" y="16" width="32" height="16" rx="4" fill="#059669"/>
  <!-- Windshield front -->
  <rect x="18" y="18" width="12" height="12" rx="2" fill="#d1fae5" opacity="0.8"/>
  <!-- Windshield back -->
  <rect x="34" y="18" width="12" height="12" rx="2" fill="#d1fae5" opacity="0.8"/>
  <!-- Front lights -->
  <rect x="8" y="32" width="6" height="4" rx="1" fill="#fcd34d"/>
  <!-- Rear lights -->
  <rect x="50" y="32" width="6" height="4" rx="1" fill="#ef4444"/>
  <!-- Wheels -->
  <circle cx="20" cy="48" r="6" fill="#1e293b"/>
  <circle cx="20" cy="48" r="3" fill="#64748b"/>
  <circle cx="44" cy="48" r="6" fill="#1e293b"/>
  <circle cx="44" cy="48" r="3" fill="#64748b"/>
</svg>
